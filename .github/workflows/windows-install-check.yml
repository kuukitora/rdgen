name: Verify candidate Windows installer
on:
  workflow_call:
    inputs:
      source_run:
        required: true
        type: string
      app_name:
        required: true
        type: string
      live_probe:
        required: false
        type: boolean
        default: false
    secrets:
      ZIP_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Candidate build workflow run ID'
        required: true
        type: string
      app_name:
        description: 'Installed application and service name'
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  install-check:
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rdgen-windows-encrypted
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Extract candidate MSI
        shell: pwsh
        env:
          RDGEN_ARTIFACT_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          python -m pip install pyzipper
          @'
          import os, pathlib, pyzipper
          folder = pathlib.Path('candidate')
          archives = list(folder.glob('*.zip'))
          if len(archives) != 1 or not os.environ.get('RDGEN_ARTIFACT_PASSWORD'):
              raise RuntimeError('Encrypted candidate or password unavailable')
          with pyzipper.AESZipFile(archives[0]) as archive:
              archive.setpassword(os.environ['RDGEN_ARTIFACT_PASSWORD'].encode())
              files = [name for name in archive.namelist() if name.lower().endswith('.msi')]
              if len(files) != 1:
                  raise RuntimeError('Expected one MSI in candidate')
              (folder / 'candidate.msi').write_bytes(archive.read(files[0]))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, restart service, reinstall and uninstall
        shell: pwsh
        env:
          APP_NAME: ${{ inputs.app_name }}
          LIVE_PROBE: ${{ inputs.live_probe }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APP_NAME -notin @('Arcade Connect', 'Arcade Connect Admin')) { throw 'Unexpected application name' }
          $msi = (Resolve-Path candidate/candidate.msi).Path
          $exe = Join-Path $env:ProgramFiles "$env:APP_NAME\$env:APP_NAME.exe"
          if ($env:LIVE_PROBE -ne 'true') {
            New-NetFirewallRule -DisplayName 'RDGen isolated installer validation' -Direction Outbound -Action Block -Program $exe | Out-Null
          }
          # Reproduce the WindowsInstaller=0 registration left by the old EXE installer.
          $legacyKey = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\$env:APP_NAME"
          if (Test-Path -LiteralPath $legacyKey) { throw 'Unexpected legacy install on the test runner.' }
          $legacyLog = Join-Path $env:RUNNER_TEMP 'rdgen-legacy-conflict.log'
          New-Item -Path $legacyKey -ErrorAction Stop | Out-Null
          try {
            New-ItemProperty -LiteralPath $legacyKey -Name WindowsInstaller -Value 0 -PropertyType DWord -ErrorAction Stop | Out-Null
            $blocked = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/L*v', "`"$legacyLog`"") -Wait -PassThru
            if ($blocked.ExitCode -ne 1603 -or !(Select-String -LiteralPath $legacyLog -Pattern 'BlockSelfInstalledApp.*Return value 3' -Quiet)) {
              throw "Expected the MSI to reject the legacy EXE registration with its conflict check. Exit code: $($blocked.ExitCode)."
            }
            if (Get-Service -Name $env:APP_NAME -ErrorAction SilentlyContinue) { throw 'Legacy conflict unexpectedly created a service.' }
          } finally {
            Remove-Item -LiteralPath $legacyKey -ErrorAction Stop
          }

          function Install-Candidate {
            $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/L*v', "`"$env:RUNNER_TEMP\rdgen-install.log`"") -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "MSI installation failed with exit code $($p.ExitCode)." }
            $service = Get-CimInstance Win32_Service -Filter "Name='$env:APP_NAME'"
            if (!$service -or $service.State -ne 'Running' -or $service.StartMode -ne 'Auto' -or $service.StartName -ne 'LocalSystem' -or !$service.PathName.StartsWith("`"$exe`"")) {
              throw 'Service is absent or does not have the expected running, automatic, LocalSystem configuration.'
            }
          }
          Install-Candidate
          if ($env:LIVE_PROBE -eq 'true') {
            $deviceId = ''
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $deviceId = (& $exe --get-id | Out-String).Trim()
              if ($deviceId -match '^\d{3,20}$') { break }
              Start-Sleep -Seconds 2
            }
            if ($deviceId -notmatch '^\d{3,20}$') { throw 'Host did not report a device ID.' }
            Write-Host "Temporary test device ID: $deviceId"
            # Give the service time to register its RustDesk key and connect.
            # Authentication must be confirmed in the console's server log;
            # its legacy /api/bd/peer endpoint reads a separate database.
            Start-Sleep -Seconds 180
            $logRoot = Join-Path $env:windir 'ServiceProfiles\LocalService\AppData\Roaming'
            if (Test-Path $logRoot) {
              Get-ChildItem -Path $logRoot -Filter '*.log' -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -like '*Arcade Connect*' -and $_.Length -lt 10MB } |
                ForEach-Object {
                  Select-String -Path $_.FullName -Pattern '\[inventory\] (device_key_not_ready|device_id_not_ready|connect_failed|challenge_timeout|challenge_failed|invalid_challenge|auth_timeout|auth_failed|connection_closed|connection_failed)' -AllMatches -ErrorAction SilentlyContinue |
                    ForEach-Object { $_.Matches.Value } | Sort-Object -Unique | ForEach-Object { Write-Host $_ }
                }
            }
            Write-Host 'Live probe observation period finished; inspect console authentication log.'
          }
          Restart-Service -Name $env:APP_NAME
          if ((Get-Service -Name $env:APP_NAME).Status -ne 'Running') { throw 'Service did not restart.' }
          Install-Candidate
          $p = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($p.ExitCode)." }
          if (Get-Service -Name $env:APP_NAME -ErrorAction SilentlyContinue) { throw 'Service remains after uninstall.' }
          Install-Candidate
          $p = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI second uninstall failed with exit code $($p.ExitCode)." }
